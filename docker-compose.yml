services:
    app:
        build:
            context: .
            dockerfile: docker/app.dockerfile
        ports:
            - 8888:80
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        ports:
            - 33061:3306
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: attendancecontrol
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

volumes:
    mysql-data:
